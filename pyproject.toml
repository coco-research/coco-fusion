[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coco-fusion"
version = "0.1.0"
description = "BYO-key multi-model persona fusion council"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["coco_fusion"]
